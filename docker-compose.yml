# Production-style local stack: the app image (API + built client) on :5000 and MongoDB.
# Needs server/.env (cp server/.env.example server/.env). DB_CONNECTION_STRING and PORT
# from that file are overridden below so the app talks to the mongo service.
services:
  mongo:
    image: mongo:9
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    env_file: server/.env
    environment:
      DB_CONNECTION_STRING: mongodb://mongo:27017/mern-template
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
