name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # bcrypt ships prebuilt binaries (glibc and musl), so its install script is not needed
      - run: npm ci --ignore-scripts
      - run: node --check index.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v7
      # Throwaway values for the smoke test only; compose overrides DB_CONNECTION_STRING and PORT
      - name: Write CI server/.env
        run: |
          cat > server/.env <<'EOF'
          JWT_SECRET=ci-smoke-only
          JWT_SALT_ROUNDS=4
          EMAIL_ID=ci@example.com
          EMAIL_PASSWORD=unused
          CORS_ORIGINS=http://localhost:5000
          EOF
      - name: Build and start the compose stack (waits for healthy)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test (/health, SPA at /, 401 on /token-check)
        run: |
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/ | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/token-check)
          echo "token-check without a token: $code"
          test "$code" = "401"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
