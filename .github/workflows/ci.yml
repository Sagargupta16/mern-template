name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # bcrypt ships prebuilt binaries (glibc and musl), so its install script is not needed
      - run: npm ci --ignore-scripts
      - run: node --check index.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mern-template:ci .
